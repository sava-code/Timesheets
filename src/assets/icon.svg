<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Timesheets app icon: a month grid with one logged day and a clock. Original artwork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b7bff"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="clock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#f08c1a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b2a7a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded-square tile (macOS-style proportions: 824 tile in a 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>

  <!-- Sheet -->
  <g filter="url(#shadow)">
    <rect x="232" y="250" width="560" height="520" rx="64" fill="#ffffff"/>
  </g>
  <!-- Sheet header band (like the table's heading row) -->
  <path d="M232 314 a64 64 0 0 1 64 -64 h432 a64 64 0 0 1 64 64 v58 h-560 z" fill="#333333"/>
  <!-- Binder rings -->
  <rect x="352" y="214" width="40" height="92" rx="20" fill="#e8eefc"/>
  <rect x="632" y="214" width="40" height="92" rx="20" fill="#e8eefc"/>

  <!-- Day cells: 4 x 3 grid, one filled day -->
  <g fill="#dbe5fb">
    <rect x="284" y="414" width="96" height="76" rx="16"/>
    <rect x="404" y="414" width="96" height="76" rx="16"/>
    <rect x="524" y="414" width="96" height="76" rx="16" fill="#2563eb"/>
    <rect x="644" y="414" width="96" height="76" rx="16"/>
    <rect x="284" y="514" width="96" height="76" rx="16"/>
    <rect x="404" y="514" width="96" height="76" rx="16"/>
    <rect x="524" y="514" width="96" height="76" rx="16"/>
    <rect x="644" y="514" width="96" height="76" rx="16"/>
    <rect x="284" y="614" width="96" height="76" rx="16"/>
    <rect x="404" y="614" width="96" height="76" rx="16"/>
  </g>

  <!-- Clock badge over the bottom-right corner -->
  <g filter="url(#shadow)">
    <circle cx="704" cy="704" r="148" fill="#ffffff"/>
  </g>
  <circle cx="704" cy="704" r="120" fill="url(#clock)"/>
  <circle cx="704" cy="704" r="92" fill="#ffffff"/>
  <path d="M704 642 V706 L748 734" fill="none" stroke="#333333" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="704" cy="706" r="14" fill="#333333"/>
</svg>
