name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            files: |
              release/Timesheets-*-setup.exe
          - os: macos-14
            script: dist:mac
            files: |
              release/Timesheets-*-mac-universal.dmg
              release/Timesheets-*-mac-universal.zip
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # macOS: package.json sets mac.identity "-" (ad-hoc signature, no Apple account needed).
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build installer
        run: npm run ${{ matrix.script }}

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: Timesheets-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
